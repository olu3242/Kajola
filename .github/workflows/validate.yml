name: Validate Skill

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Skill structure validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for evals.json checks)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run skill structure validation
        run: |
          chmod +x scripts/validate-skill.sh
          bash scripts/validate-skill.sh

      - name: Run example SORF compliance checks
        run: |
          chmod +x scripts/check-example.sh
          # Pre-SORF examples were written before check-example.sh existed and do not
          # include all SORF invariants (availability_windows, branch_kpis, held_until, etc.).
          # They are preserved as canonical originals. Only examples created after the SORF
          # standard was established are validated here.
          SKIP="examples/README.md examples/kajola-artisan-platform.md examples/toolhire-pro-nigeria.md examples/boda-connect-kenya.md examples/parcelrun-ghana-ci.md"
          FAILED=0
          for f in examples/*.md; do
            if echo "$SKIP" | grep -qF "$f"; then
              echo "--- Skipping pre-SORF example: $f ---"
              continue
            fi
            echo "--- Checking $f ---"
            bash scripts/check-example.sh "$f" || FAILED=$((FAILED + 1))
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED example(s) failed SORF compliance checks"
            exit 1
          fi
